# Gradle JVM & Network configuration to resolve SSL peer shutdown and connection drop issues
org.gradle.jvmargs=-Xmx2048m -Dhttps.protocols=TLSv1.2,TLSv1.3 -Dhttp.keepAlive=false -Dhttps.keepAlive=false

# System properties for HTTPS TLS protocol, keep-alive and connection timeouts
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.keepAlive=false
systemProp.https.keepAlive=false
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
